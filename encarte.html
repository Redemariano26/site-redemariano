<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Encarte | Mariano Rede de Farmácias</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        /* =========================
           BANNER PRINCIPAL
        ========================= */

        .banner-encarte {
            width: 100%;
            overflow: hidden;
        }

        .banner-encarte img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* =========================
           BOTÃO VOLTAR AO INÍCIO
        ========================= */

        .botao-voltar {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 20px 10px;
            background: #f5f5f5;
        }

        .botao-voltar a {
            display: inline-block;
            background: #C4232A;
            color: #FFD000;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            padding: 12px 28px;
            border-radius: 30px;
            transition: 0.25s ease;
        }

        .botao-voltar a:hover {
            background: #FFD000;
            color: #C4232A;
        }

        /* =========================
           ENCARTE
        ========================= */

        .encarte-container {
            width: 100%;
            min-height: 100vh;
            padding: 10px 20px 20px;
            display: flex;
            justify-content: center;
        }

        .encarte {
            width: 100%;
            max-width: 1400px;
            height: calc(100vh - 40px);
            min-height: 650px;
            border: none;
        }

        /* =========================
           CELULAR
        ========================= */

        @media (max-width: 768px) {

            .banner-encarte img {
                width: 100%;
                height: auto;
            }

            .botao-voltar {
                padding: 15px 15px 10px;
            }

            .botao-voltar a {
                font-size: 15px;
                padding: 11px 24px;
            }

            .encarte-container {
                padding: 0;
            }

            .encarte {
                height: 100vh;
                min-height: 600px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         BANNER PRINCIPAL
    ========================= -->

    <div class="banner-encarte">
        <img 
            src="/assets/img/FACEBOOK.png" 
            alt="A farmácia queridinha do povo"
        >
    </div>


    <!-- =========================
         BOTÃO VOLTAR AO INÍCIO
    ========================= -->

    <div class="botao-voltar">
        <a href="index.html">
            ← Voltar para o início
        </a>
    </div>


    <!-- =========================
         ENCARTE
    ========================= -->

    <div class="encarte-container">

        <iframe
            class="encarte"
            src="https://heyzine.com/flip-book/61c926c041.html"
            allowfullscreen
            allow="clipboard-write"
            scrolling="no">
        </iframe>

    </div>

</body>
</html>
