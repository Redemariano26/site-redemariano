<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Rede Mariano</title>

<link rel="icon" href="/assets/img/favicon.png">

<style>

/* =========================
   RESET
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}


/* =========================
   PÁGINA
========================= */

body{
  font-family:Arial, sans-serif;
  background:#f4f6fb;
  min-height:100vh;
}


/* =========================
   ÁREA PRINCIPAL
========================= */

.login-banner{

  position:relative;

  width:100%;

  min-height:100vh;

  background-image:url('/assets/img/FACEBOOK.png');

  background-size:cover;

  background-position:center;

  background-repeat:no-repeat;

  display:flex;

  align-items:center;

  justify-content:flex-end;

  padding:40px 8%;

}


/* =========================
   CAMADA SUAVE
========================= */

.login-banner::before{

  content:"";

  position:absolute;

  inset:0;

  background:rgba(0,0,0,0.04);

  pointer-events:none;

}


/* =========================
   CAIXA DE LOGIN
========================= */

.login-box{

  position:relative;

  z-index:2;

  width:100%;

  max-width:390px;

  background:rgba(255,255,255,0.96);

  padding:38px;

  border-radius:18px;

  text-align:center;

  box-shadow:
    0 15px 40px rgba(0,0,0,0.22);

  backdrop-filter:blur(4px);

}


/* =========================
   TÍTULO
========================= */

.login-box h2{

  color:#C4232A;

  font-size:27px;

  margin-bottom:28px;

  font-weight:700;

}


/* =========================
   CAMPOS
========================= */

.input-group{

  margin-bottom:15px;

}


input{

  width:100%;

  height:52px;

  padding:0 15px;

  margin:0;

  border-radius:9px;

  border:1px solid #d2d2d2;

  font-size:15px;

  font-family:Arial,sans-serif;

  outline:none;

  transition:.25s;

}


input:focus{

  border-color:#C4232A;

  box-shadow:
    0 0 0 3px rgba(196,35,42,.10);

}


/* =========================
   BOTÃO
========================= */

button{

  width:100%;

  height:52px;

  margin-top:8px;

  padding:0 15px;

  background:#C4232A;

  color:#fff;

  border:none;

  border-radius:9px;

  font-size:16px;

  font-weight:bold;

  cursor:pointer;

  transition:.25s ease;

}


button:hover{

  background:#a91d23;

  transform:translateY(-2px);

  box-shadow:
    0 8px 18px rgba(196,35,42,.25);

}


/* =========================
   TEXTO INFERIOR
========================= */

.login-info{

  margin-top:20px;

  color:#777;

  font-size:12px;

}


/* =========================
   MOBILE
========================= */

@media(max-width:768px){

  .login-banner{

    min-height:100vh;

    padding:30px 18px;

    justify-content:center;

    align-items:center;

    background-position:center;

  }


  .login-box{

    max-width:380px;

    padding:32px 25px;

    background:rgba(255,255,255,.97);

  }


  .login-box h2{

    font-size:24px;

  }

}


/* =========================
   CELULAR PEQUENO
========================= */

@media(max-width:480px){

  .login-banner{

    padding:20px 15px;

  }


  .login-box{

    padding:28px 20px;

    border-radius:15px;

  }

}

</style>

</head>


<body>


<!-- =========================
     BANNER + LOGIN
========================= -->

<section class="login-banner">


  <!-- LOGIN -->

  <div class="login-box">

    <h2>Área do Colaborador</h2>


    <div class="input-group">

      <input
        type="email"
        id="email"
        placeholder="Email"
        autocomplete="username"
      >

    </div>


    <div class="input-group">

      <input
        type="password"
        id="senha"
        placeholder="Senha"
        autocomplete="current-password"
      >

    </div>


    <button onclick="login()">
      Entrar
    </button>


    <div class="login-info">
      Acesso exclusivo para colaboradores
    </div>

  </div>


</section>


<script>

/* =========================
   USUÁRIOS CADASTRADOS
========================= */

const usuarios = [

  {
    email: "admin@rede.com",
    senha: "20262@",
    tipo: "admin",
    acessos: [
      "financeiro",
      "agenda",
      "info",
      "Cotas"
    ]
  },

  {
    email: "cotas",
    senha: "2026",
    tipo: "user",
    acessos: [
      "Cotas"
    ]
  }

];


/* =========================
   LOGIN
========================= */

function login(){

  const email =
    document.getElementById("email").value;

  const senha =
    document.getElementById("senha").value;


  const user =
    usuarios.find(
      u =>
        u.email === email &&
        u.senha === senha
    );


  if(!user){

    alert("Email ou senha inválidos");

    return;

  }


  localStorage.setItem(
    "usuarioLogado",
    JSON.stringify(user)
  );


  window.location.href =
    "painel.html";

}


/* =========================
   ENTER PARA ENTRAR
========================= */

document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      login();

    }

  }
);

</script>


</body>

</html>
