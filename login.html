<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Rede Mariano</title>

<link rel="icon" href="/assets/img/favicon.png">

<style>

/* =========================
   RESET
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}


/* =========================
   PÁGINA
========================= */

body{

  font-family:Arial, sans-serif;

  min-height:100vh;

  background:#C4232A;

}


/* =========================
   ÁREA PRINCIPAL
========================= */

.login-area{

  min-height:100vh;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:40px;

}


/* =========================
   CONTEÚDO
========================= */

.login-container{

  width:100%;

  max-width:1200px;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:70px;

}


/* =========================
   LADO DA IMAGEM
========================= */

.banner-lado{

  width:58%;

  display:flex;

  justify-content:center;

  align-items:center;

}


.banner-lado img{

  width:100%;

  max-width:680px;

  height:auto;

  display:block;

  border-radius:18px;

  box-shadow:
    0 20px 45px rgba(0,0,0,.20);

}


/* =========================
   LADO DO LOGIN
========================= */

.login-box{

  width:100%;

  max-width:390px;

  background:#fff;

  padding:42px 38px;

  border-radius:18px;

  text-align:center;

  box-shadow:
    0 20px 45px rgba(0,0,0,.22);

}


/* =========================
   TÍTULO
========================= */

.login-box h2{

  color:#C4232A;

  font-size:27px;

  margin-bottom:30px;

  font-weight:700;

}


/* =========================
   CAMPOS
========================= */

input{

  width:100%;

  height:52px;

  padding:0 15px;

  margin-bottom:16px;

  border-radius:9px;

  border:1px solid #d0d0d0;

  font-size:15px;

  outline:none;

}


input:focus{

  border-color:#C4232A;

  box-shadow:
    0 0 0 3px rgba(196,35,42,.10);

}


/* =========================
   BOTÃO
========================= */

button{

  width:100%;

  height:52px;

  margin-top:3px;

  background:#C4232A;

  color:#fff;

  border:none;

  border-radius:9px;

  font-size:16px;

  font-weight:bold;

  cursor:pointer;

  transition:.25s ease;

}


button:hover{

  background:#a91d23;

  transform:translateY(-2px);

}


/* =========================
   TEXTO
========================= */

.login-info{

  margin-top:20px;

  font-size:12px;

  color:#777;

}
/* =========================
   BOTÃO VOLTAR
========================= */

.btn-voltar{

  display:inline-block;

  margin-top:18px;

  color:#C4232A;

  text-decoration:none;

  font-size:14px;

  font-weight:600;

  transition:.25s ease;

}

.btn-voltar:hover{

  color:#FFD000;

}


/* =========================
   MOBILE
========================= */

@media(max-width:800px){

  .login-area{

    padding:25px 18px;

  }


  .login-container{

    flex-direction:column;

    gap:25px;

  }


  .banner-lado{

    width:100%;

  }


  .banner-lado img{

    max-width:550px;

  }


  .login-box{

    max-width:420px;

  }

}


/* =========================
   CELULAR PEQUENO
========================= */

@media(max-width:480px){

  .login-area{

    padding:20px 15px;

  }


  .banner-lado img{

    border-radius:12px;

  }


  .login-box{

    padding:32px 22px;

    border-radius:14px;

  }


  .login-box h2{

    font-size:23px;

  }

}

</style>

</head>


<body>


<!-- =========================
     ÁREA DE LOGIN
========================= -->

<section class="login-area">

  <div class="login-container">


    <!-- IMAGEM -->

    <div class="banner-lado">

      <img
        src="/assets/img/FACEBOOK.png"
        alt="A farmácia queridinha do povo"
      >

    </div>


    <!-- LOGIN -->

    <div class="login-box">

      <h2>Área do Colaborador</h2>


      <input
        type="email"
        id="email"
        placeholder="Email"
        autocomplete="username"
      >


      <input
        type="password"
        id="senha"
        placeholder="Senha"
        autocomplete="current-password"
      >


      <button onclick="login()">
        Entrar
      </button>


      <div class="login-info">
        Acesso exclusivo para colaboradores
      </div>

      <a href="index.html" class="btn-voltar">
      ← Voltar para o início
      </a>

    </div>
    


  </div>

</section>
<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script>

/* =========================
   CONFIGURAÇÃO DO FIREBASE
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyAJUVe3-r-N6ImLbhGmfyHAcXhBoDeeX28",
  authDomain: "portal-promocional-mariano.firebaseapp.com",
  projectId: "portal-promocional-mariano",
  storageBucket: "portal-promocional-mariano.firebasestorage.app",
  messagingSenderId: "216204039580",
  appId: "1:216204039580:web:561e9faf871e1c5333a459",
  measurementId: "G-2P9Y5VWZGZ"
};

/* =========================
   INICIALIZAR FIREBASE
========================= */

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

/* =========================
   LOGIN
========================= */

async function login() {

  const email = document
    .getElementById("email")
    .value
    .trim()
    .toLowerCase();

  const senha = document
    .getElementById("senha")
    .value;

  if (!email || !senha) {
    alert("Preencha o e-mail e a senha.");
    return;
  }

  try {

    const resultado = await auth.signInWithEmailAndPassword(
      email,
      senha
    );

    const usuarioFirebase = resultado.user;

    const user = {
      email: usuarioFirebase.email,
      uid: usuarioFirebase.uid,
      tipo: usuarioFirebase.email === "admin@rede.com"
        ? "admin"
        : "user",
      acessos: usuarioFirebase.email === "admin@rede.com"
        ? ["admin"]
        : ["promocoes"]
    };

    localStorage.setItem(
      "usuarioLogado",
      JSON.stringify(user)
    );

    window.location.href = "painel.html";

  } catch (erro) {

    console.error(erro);

    if (
      erro.code === "auth/invalid-credential" ||
      erro.code === "auth/wrong-password" ||
      erro.code === "auth/user-not-found"
    ) {
      alert("E-mail ou senha inválidos.");
    } else {
      alert("Não foi possível entrar. Verifique sua conexão e tente novamente.");
    }

  }

}

/* =========================
   ENTER PARA ENTRAR
========================= */

document.addEventListener("keydown", function(event) {

  if (event.key === "Enter") {
    login();
  }

});

</script>



</body>

</html>
